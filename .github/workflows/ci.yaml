name: CI

permissions:
    contents: read

on:
    workflow_dispatch:
    # Pushes to main run CI through release.yaml, which calls this workflow
    # and only releases after it passes.
    workflow_call:
        secrets:
            CODECOV_TOKEN:
                required: false
    pull_request:
        branches:
            - main

concurrency:
    group: ci-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        name: CI

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile
            - run: bun audit --prod
            - run: bun run lint
            - run: bun run pretty:check
            - run: bun run build
            - run: bun test --coverage
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v7.1.1
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  fail_ci_if_error: true

    # Fails when .github/workflows/actions.lock is out of sync with the
    # workflows or a locked pin no longer verifies upstream.
    verify-lockfile:
        name: Verify actions lockfile

        runs-on: ubuntu-latest

        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - run: gh extension install github/gh-actions-lock --pin v0.3.0
            - run: gh actions-lock --verify
